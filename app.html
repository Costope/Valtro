<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <link rel="manifest" href="manifest.json" />

    <!-- APPLE META -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#0b0f19" />

    <!-- ICON -->
    <link rel="apple-touch-icon" href="./assets/icon-512.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./assets/icon-192.png"
    />

    <title>Valtro</title>

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- LINK CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="pwa-header-circle">
      <div class="header-content">
        <div class="endkapital-block">
          <span class="endkapital-label">Final Capital</span>

          <div class="endkapital-row">
            <h1 class="endkapital-value" id="val-endkapital">
              <span id="counter-endkapital">0 €</span>
              <svg
                class="svg-copy"
                id="copyBtn"
                title="Kopieren"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                <path
                  d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
                />
              </svg>
            </h1>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-column">
            <span class="stat-label">Deposit</span>
            <span class="stat-num" id="val-einzahlung">0 €</span>
          </div>

          <div class="stat-column" style="text-align: right">
            <span class="stat-label">Return</span>
            <span class="stat-num positive" id="val-rendite">+0 €</span>
          </div>
        </div>
      </div>
    </header>

    <main class="form-container">
      <div class="input-group">
        <label for="start-capital">Start Capital</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="start-capital"
            placeholder="10.000"
            inputmode="decimal"
          />
          <span class="unit">€</span>
        </div>
      </div>

      <div class="input-group">
        <label>Deposit Interval</label>
        <div class="segmented-control">
          <input
            type="radio"
            name="interval"
            id="int-monthly"
            value="monthly"
            checked
          />
          <label for="int-monthly">Monthly</label>

          <input
            type="radio"
            name="interval"
            id="int-quarterly"
            value="quarterly"
          />
          <label for="int-quarterly">Quarterly</label>

          <input type="radio" name="interval" id="int-yearly" value="yearly" />
          <label for="int-yearly">Yearly</label>
        </div>
      </div>

      <div class="input-group">
        <label for="deposit-amount">Deposit Amount per Period</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="deposit-amount"
            placeholder="250"
            inputmode="decimal"
          />
          <span class="unit">€</span>
        </div>
      </div>

      <div class="input-row">
        <div class="input-group">
          <label for="interest-rate">Annual Interest Rate</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="interest-rate"
              placeholder="8"
              inputmode="decimal"
              maxlength="4"
            />
            <span class="unit">%</span>
          </div>
        </div>

        <div class="input-group">
          <label for="duration">Duration</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="duration"
              placeholder="10"
              inputmode="numeric"
              maxlength="2"
            />
            <span class="unit">Years</span>
          </div>
        </div>
      </div>

      <div class="action-buttons">
        <button class="reset-btn">
          Reset Values
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="reset-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.25"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>

        <button class="secondary-btn">
          Share your result
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="share-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 2v13" />
            <path d="m16 6-4-4-4 4" />
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
          </svg>
        </button>
      </div>
    </main>

    <footer>
      <div class="footer-content">
        <span class="footer-text">Made with ❤️ by Costope</span>
        <a href="https://github.com/costope/valtro" class="footer-link">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="#ffffff"
            class="bi bi-github"
            viewBox="0 0 16 16"
          >
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"
            />
          </svg>
        </a>
      </div>
    </footer>

    <!-- Notification Toast -->
    <div id="toast">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="20 6 9 17 4 12" />
      </svg>
      <span id="toast-text">Endkapital kopiert!</span>
    </div>

    <!-- Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("[ ✓ ] Service Worker successfully registered");
            })
            .catch((error) => {
              console.log(
                "[ X ] Error while registering Service Worker! Error: " + error,
              );
            });
        });
      }
    </script>
    <script src="script.js"></script>
  </body>
</html>
