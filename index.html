<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Valtro - Plan your future</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent-darkblue: #071326;
        --accent-lightblue: #165174;
      }
      html {
        background-color: #071326;
      }
      body {
        background:
          radial-gradient(
            circle at 20% 15%,
            rgba(41, 128, 185, 0.35),
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 85%,
            rgba(10, 34, 64, 0.8),
            transparent 60%
          ),
          radial-gradient(
            circle at 50% 50%,
            rgba(22, 81, 116, 0.25),
            transparent 70%
          ),
          linear-gradient(
            135deg,
            var(--accent-darkblue),
            #0d2342 40%,
            #12385c 70%,
            var(--accent-lightblue)
          );
        background-attachment: fixed;
        margin: 0;
        min-height: 100dvh;
        color: #ffffff;
        font-family: "Inter", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow: hidden;
      }
      .container {
        padding: 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-weight: 700;
        font-size: 3.8rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 32px;
        font-size: 1.05rem;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 300;
      }
      .button-group,
      .social-media,
      .btn,
      .social-media a,
      .social-media button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .button-group {
        gap: 12px;
      }
      .btn {
        gap: 8px;
        padding: 12px 22px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn svg {
        width: 1.1em;
        height: 1.1em;
      }
      .btn-primary {
        background: #ffffff;
        color: #0b1d3a;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }
      .btn-primary:hover {
        background: rgba(255, 255, 255, 0.92);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #ffffff;
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.15);
        transform: translateY(-2px);
      }
      .btn:active {
        transform: scale(0.97);
      }

      /* --- FOOTER --- */
      .social-media {
        gap: 25px;
        position: fixed !important;
        bottom: 34px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9000;
      }
      .social-media a {
        text-decoration: none;
        transition: transform 0.2s;
      }
      .social-media svg {
        width: 25px;
        height: 25px;
        fill: #ffffff;
        opacity: 0.4;
        transition: all 0.2s;
        filter: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org'><filter id='thin'><feMorphology operator='erode' radius='0.5'/></filter></svg>#thin");
      }
      .social-media a:hover {
        transform: translateY(-1px);
      }
      .social-media a:hover svg {
        opacity: 0.8;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Valtro</h1>
      <p>Plan your future</p>

      <div class="button-group">
        <!-- Open Valtro -->

            viewBox="0 0 24 24"
            fill="none"

            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
